services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opentoken
      POSTGRES_USER: opentoken
      POSTGRES_PASSWORD: opentoken
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentoken -d opentoken"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://opentoken:opentoken@postgres:5432/opentoken
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: change-this-before-production
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: admin-password123
      SEED_USER_EMAIL: user@example.com
      SEED_USER_PASSWORD: password123
      ALLOWED_ORIGINS: http://127.0.0.1:18080,http://localhost:18080
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "18080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
